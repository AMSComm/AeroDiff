name: Release AeroDiff

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run code validation & tests
        run: |
          pnpm run lint
          pnpm test
          pnpm run build

      - name: Build Desktop App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AeroDiff ${{ github.ref_name }}'
          releaseBody: |
            ## AeroDiff ${{ github.ref_name }}
            
            ### Highlights
            - ⚡ High-speed Myers and Patience diff engine in Rust with intra-line precision highlighting.
            - ✏️ Direct in-place editing in both text diff panes and CSV table cells with live re-diffing.
            - 📜 Unified master vertical scrollbar with proportional alignment & synchronized horizontal scrolling.
            - 🚀 60fps virtualized DOM rendering handling 500,000+ line files with <35MB idle memory.
            - 📁 Multi-threaded parallel folder comparison with CRC32/Blake3 hash verification.
            - 🔄 Built-in in-app auto-update and restart.
            - 📦 Multi-platform native installers for macOS, Windows, and Linux.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  sync-release-notes:
    needs: release-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update GitHub Release Notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags || true
          TARGET_TAG="${{ github.ref_name }}"
          if [[ ! "$TARGET_TAG" =~ ^v[0-9] ]]; then
            TARGET_TAG=$(git tag --sort=-v:refname | head -n 1)
          fi
          echo "Target tag: $TARGET_TAG"
          
          python3 -c "
          import re
          tag = '$TARGET_TAG'
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          tag_escaped = re.escape(tag.lstrip('v'))
          pattern = rf'(## \[[v]?{tag_escaped}\].*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(1).strip()
              with open('release_notes.md', 'w') as out:
                  out.write(notes)
              print('Extracted release notes successfully.')
          else:
              print('Warning: tag not found in CHANGELOG.md')
          "

          if [ -f release_notes.md ]; then
            echo "Syncing release notes for $TARGET_TAG in repo ${{ github.repository }}..."
            SUCCESS=false
            for i in {1..5}; do
              if gh release edit "$TARGET_TAG" --repo "${{ github.repository }}" --notes-file release_notes.md; then
                echo "Successfully updated $TARGET_TAG release notes on GitHub!"
                SUCCESS=true
                break
              fi
              echo "Attempt $i failed to edit release $TARGET_TAG. Waiting 5 seconds before retry..."
              sleep 5
            done
            if [ "$SUCCESS" != "true" ]; then
              echo "Failed to edit release after 5 attempts. Checking if release exists..."
              gh release view "$TARGET_TAG" --repo "${{ github.repository }}" || echo "Release $TARGET_TAG does not exist on GitHub."
              exit 1
            fi
          else
            echo "No release_notes.md file generated, skipping update."
          fi
