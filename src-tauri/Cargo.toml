[package]
name = "aerodiff"
version = "0.1.2"
description = "AeroDiff - Ultra-fast, lightweight cross-platform diff & merge tool"
authors = ["AM Software <contact@amsoftware.com.vn>"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "2.6", features = ["inline", "bytes"] }
crc32fast = "1.4"
memmap2 = "0.9"
rayon = "1.10"
walkdir = "2.5"
regex = "1.11"
csv = "1.3"
encoding_rs = "0.8.41"
memchr = "2.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.17"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
